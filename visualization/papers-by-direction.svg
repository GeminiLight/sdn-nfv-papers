<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Research direction mix</title>
  <desc id="chart-description">Horizontal bars compare paper counts by primary research direction.</desc>
  <style>
    :root { color-scheme: light dark; --background: #fbfdff; --foreground: #24324a; --muted: #66758e; --grid: #e5edf7; --frame: #c9d6e6; --series-blue: #64aaf5; --series-green: #59cda5; --series-purple: #a184ee; --series-gold: #f2bd59; --series-rose: #ef8da5; --series-slate: #91a6c4; }
    @media (prefers-color-scheme: dark) { :root { --background: #141b2a; --foreground: #f3f7ff; --muted: #b5c1d6; --grid: #33415a; --frame: #53647e; --series-blue: #79b9ff; --series-green: #70dfb9; --series-purple: #b49aff; --series-gold: #ffd071; --series-rose: #ff9fb5; --series-slate: #aabedb; } }
    text { fill: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
    .subtitle, .note { fill: var(--muted); }
    .subtitle { font-size: 14px; }
    .note { font-size: 12px; }
    .axis-label { fill: var(--muted); font-size: 12px; }
    .axis-title { fill: var(--muted); font-size: 13px; font-weight: 600; }
    .value { font-size: 12px; font-weight: 650; }
    .legend { font-size: 12px; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1; }
  </style>
  <rect width="1200" height="530" rx="14" fill="var(--background)"/>
  <text class="title" x="54" y="45">Research direction mix</text>
  <text class="subtitle" x="54" y="72">Primary direction assigned to each cataloged paper</text>
  <line class="grid" x1="224.0" y1="120" x2="224.0" y2="444"/>
  <text class="axis-label" x="224.0" y="110" text-anchor="middle">0</text>
  <line class="grid" x1="370.0" y1="120" x2="370.0" y2="444"/>
  <text class="axis-label" x="370.0" y="110" text-anchor="middle">25</text>
  <line class="grid" x1="516.0" y1="120" x2="516.0" y2="444"/>
  <text class="axis-label" x="516.0" y="110" text-anchor="middle">50</text>
  <line class="grid" x1="662.0" y1="120" x2="662.0" y2="444"/>
  <text class="axis-label" x="662.0" y="110" text-anchor="middle">75</text>
  <line class="grid" x1="808.0" y1="120" x2="808.0" y2="444"/>
  <text class="axis-label" x="808.0" y="110" text-anchor="middle">100</text>
  <line class="grid" x1="954.0" y1="120" x2="954.0" y2="444"/>
  <text class="axis-label" x="954.0" y="110" text-anchor="middle">125</text>
  <line class="grid" x1="1100.0" y1="120" x2="1100.0" y2="444"/>
  <text class="axis-label" x="1100.0" y="110" text-anchor="middle">150</text>
  <rect class="frame" x="224" y="120" width="876" height="324"/>
  <text x="208" y="151" text-anchor="end">Deployment</text>
  <rect x="224" y="132" width="735.8" height="28" rx="3" fill="var(--series-blue)">
    <title>Deployment: 126 papers (50.6%)</title>
  </rect>
  <text class="value" x="969.8" y="151">126 · 50.6%</text>
  <text x="208" y="205" text-anchor="end">Other / unspecified</text>
  <rect x="224" y="186" width="251.1" height="28" rx="3" fill="var(--series-slate)">
    <title>Other / unspecified: 43 papers (17.3%)</title>
  </rect>
  <text class="value" x="485.1" y="205">43 · 17.3%</text>
  <text x="208" y="259" text-anchor="end">Scheduling</text>
  <rect x="224" y="240" width="186.9" height="28" rx="3" fill="var(--series-green)">
    <title>Scheduling: 32 papers (12.9%)</title>
  </rect>
  <text class="value" x="420.9" y="259">32 · 12.9%</text>
  <text x="208" y="313" text-anchor="end">Chaining</text>
  <rect x="224" y="294" width="122.6" height="28" rx="3" fill="var(--series-purple)">
    <title>Chaining: 21 papers (8.4%)</title>
  </rect>
  <text class="value" x="356.6" y="313">21 · 8.4%</text>
  <text x="208" y="367" text-anchor="end">Routing</text>
  <rect x="224" y="348" width="87.6" height="28" rx="3" fill="var(--series-gold)">
    <title>Routing: 15 papers (6.0%)</title>
  </rect>
  <text class="value" x="321.6" y="367">15 · 6.0%</text>
  <text x="208" y="421" text-anchor="end">Slicing</text>
  <rect x="224" y="402" width="70.1" height="28" rx="3" fill="var(--series-rose)">
    <title>Slicing: 12 papers (4.8%)</title>
  </rect>
  <text class="value" x="304.1" y="421">12 · 4.8%</text>
  <text class="axis-title" x="662.0" y="478" text-anchor="middle">Paper count</text>
  <text class="note" x="54" y="512">Source: data/papers.csv · Multiple-value fields are represented by their primary direction</text>
</svg>
